services:
  looped-transformers:
    build: .
    ports:
      - '127.0.0.1:8765:8765'
    environment:
      LOOPED_TRANSFORMERS_API_KEY: ${LOOPED_TRANSFORMERS_API_KEY:?Set LOOPED_TRANSFORMERS_API_KEY before starting the service}
    volumes:
      - ./runs:/runs
      - ./configs:/app/configs
      - ./data:/app/data:ro
    restart: unless-stopped
