name: qwen3-06b-screen
model:
  backend: hf
  model_id: Qwen/Qwen3-0.6B-Base
  # For confirmation runs, pin a checkpoint commit. The resolved revision is recorded.
  revision: null
  device: cuda
  dtype: bfloat16
  max_context: 512
datasets:
  - {path: ../data/smoke_text.jsonl, kind: text, split: synthetic, purpose: smoke}
  - {path: ../data/smoke_qa.jsonl, kind: qa, split: synthetic, purpose: smoke}
variants:
  - name: identity
    loop: {start: 12, end: 15, steps: 1}
  - name: euler-block
    loop: {start: 12, end: 15, steps: 2, mode: block, anchor: 0.5}
  - name: euler-layer
    loop: {start: 12, end: 15, steps: 2, mode: layer, anchor: 0.5}
stride: 256
bootstrap_samples: 2000
seed: 42
trace: true
output_dir: ../runs
